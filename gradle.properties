# === === === Base Properties === === ===
# Base properties
modId=examplemod
modName=Example Mod
modVersion=1.0.0
modGroupId=com.example.examplemod
modArchivesName=ExampleMod
modDescription=A modern Minecraft 1.7.10 mod template powered by UniMixins and Forgelin
url=
credits=ExampleDude
authorList="ExampleDude"
logo=
modDependencies=

# === === === Developer Account Properties === === ===
# GTNH-style developer account for runClient: a fixed username (no more random
# Player), and the UUID is deterministically derived from the username, so the
# same name always maps to the same UUID (stable saves per developer).
# Different developers just use different names to get separate accounts.
# Temporary override without editing this file: gradlew runClient -PdevName=Alice
developmentEnvironmentUserName=developer
# Optional: pin a specific UUID (empty = auto-derived from the username)
# developmentEnvironmentUUID=

# === === === Kotlin Properties (Forgelin) === === ===
# Kotlin support is DISABLED by default. Only used when re-enabled:
# build.gradle reads these properties only when enableUsingKotlin=true
enableUsingKotlin=false
# Forgelin 2 version (LegacyModdingMC); the suffix after '-' is the bundled Kotlin version
forgelin_version=2.4.3-2.4.10
# Kotlin Gradle plugin & stdlib version, must match Forgelin's Kotlin version
kotlin_version=2.4.10
# Disable the stdlib dependency auto-added by KGP (declared explicitly in build.gradle)
kotlin.stdlib.default.dependency=false
# Suppress the Kotlin deprecated-Gradle warning (FG 1.2 cannot run on Gradle 8)
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# === === === Scala Properties === === ===
# Enable Scala support (sources go under src/main/scala/, declare scala-library yourself)
enableUsingScala=false

# === === === UniMixins Properties (ASM + Mixin) === === ===
# UniMixins handles both Mixin loading and ASM transformer compatibility
# (Mixingasm module), so a single dependency covers ASM and Mixin.
enableUsingMixin=true
# UniMixins version, pinned here so you don't have to dig into mixin.gradle
unimixinsVersion=0.3.1

# === === === Other Properties === === ===
# Allow to include LICENSE file
include_license=true

# === === === Tags Properties === === ===
# Set to false to disable auto-extraction from Tags.java
# (modVersion/modName/modId in gradle.properties will be used directly instead)
needTagsToIdentify=true
# Optional: manually specify Tags.java path; if commented out, auto-detect under src/
# tags_file_path=src/main/java/com/example/examplemod/Tags.java
