// ============================================================
// dependencies.gradle - Mod dependencies (like GTNH ExampleMod1.7.10)
//
// Declares all mod dependencies in one place. Apply this script from
// build.gradle via: apply from: 'dependencies.gradle'
// ============================================================

dependencies {
    if (project.enableUsingKotlin.toBoolean()) {
        // Kotlin stdlib: needed to compile & run in the dev environment.
        // It is NOT bundled into the mod jar - Forgelin's DepLoader downloads
        // the matching Kotlin version at runtime instead.
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

        // Forgelin 2 (LegacyModdingMC): Kotlin language adapter for 1.7.10
        // https://github.com/LegacyModdingMC/Forgelin
        // Resolved from the Modrinth Maven
        implementation "maven.modrinth:forgelin-legacy:$forgelin_version"
    }

    if (project.enableUsingScala.toBoolean()) {
        // When Scala is enabled, declare the scala-library yourself (example below)
        // implementation "org.scala-lang:scala-library:2.13.16"
    }

    // Local jars under the lib/ directory (gitignored)
    implementation fileTree(dir: 'lib', includes: ['*.jar'])
}
