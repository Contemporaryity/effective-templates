// ============================================================
// publish.gradle - Maven publishing configuration
//
// Everything about publishing the mod jar lives here:
//   * Applies the maven-publish plugin
//   * Publishes the main jar (components.java) plus the sourcesJar and
//     deobfJar artifacts (both defined in build.gradle)
//   * Disables Gradle module metadata generation (.module files)
//   * Filters dependencies without a groupId (e.g. forgeBin) out of the
//     generated POM, so the published POM stays resolvable
// ============================================================
import groovy.util.Node

apply plugin: 'maven-publish'

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact deobfJar
            groupId = project.group
            artifactId = project.archivesBaseName
            version = project.version

            // Filter out dependencies without a groupId (e.g. forgeBin)
            pom.withXml {
                def depsNode = asNode().get("dependencies")
                if (depsNode.size() > 0) {
                    depsNode[0].children().removeAll { dep ->
                        if (!(dep instanceof Node)) return false
                        if (dep.name().localPart != "dependency") return false
                        def groupIdNodes = dep.get("groupId")
                        return groupIdNodes.isEmpty() || groupIdNodes[0].text().trim().isEmpty()
                    }
                }
            }
        }
    }
}
