// ============================================================
// build.gradle - Template build script for Minecraft 1.7.10 mods
import org.gradle.api.GradleException
import groovy.util.Node
//
// Features:
//   * ForgeGradle 1.2 (anatawa12 fork) - supports modern Gradle (>= 7.4)
//   * UniMixins - Mixin loading and ASM transformer compatibility (Mixingasm) in one
//   * Forgelin 2 - Kotlin language support (ILanguageAdapter)
//   * Scala language support (optional switch, sources go under src/main/scala/)
//   * MCLib - optional shadeable library (UpdateCheck/AssetDirector/
//     SloppyDepLoader), disabled by default, see mclib.gradle
//     MCLib - 可选的内嵌库（UpdateCheck/AssetDirector/SloppyDepLoader），
//     默认禁用，详见 mclib.gradle
//   * Jitpack ready - jitpack.yml + jitpack.io repository pre-configured
//   * Dependencies in a separate dependencies.gradle
//   * Tags.java auto-extraction of mod metadata (modVersion/modName/modId),
//     implemented in versioning.gradle; optional GTNH-style git tag
//     versioning can regenerate Tags.java from pushed git tags
//     依赖独立在 dependencies.gradle；Tags.java 元数据提取逻辑独立在 versioning.gradle，
//     并可选开启 GTNH 风格的 git tag 版本化（自动改写 Tags.java）
// ============================================================

buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
        maven {
            name = 'Aliyun'
            url = 'https://maven.aliyun.com/repository/public/'
        }
    }

    dependencies {
        // anatawa12's ForgeGradle 1.2 fork, works with Gradle 4.4.1+
        // https://github.com/anatawa12/ForgeGradle-1.2
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }

        if (project.enableUsingKotlin.toBoolean()) {
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$project.kotlin_version"
        }
    }
}

apply plugin: 'forge'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'java'
apply plugin: 'maven-publish'

if (project.enableUsingKotlin.toBoolean()) {
    // The entry-point plugin for Kotlin 2.x
    apply plugin: 'org.jetbrains.kotlin.jvm'
}

if (project.enableUsingScala.toBoolean()) {
    // Scala plugin (sources go under src/main/scala/)
    apply plugin: 'scala'
}

version = "${project.modVersion}"
group = "${project.modGroupId}"
archivesBaseName = "${project.modArchivesName}"

configurations {
    includeCompile
    implementation.extendsFrom includeCompile
}

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "minecraft"
}

repositories {
    mavenLocal()
    mavenCentral()

    flatDir {
        dirs 'libs'
    }

    maven {
        name "Curse Maven"
        url "https://cursemaven.com"
    }

    maven {
        name "Modrinth Maven"
        url "https://api.modrinth.com/maven"
    }

    maven {
        name 'Aliyun'
        url 'https://maven.aliyun.com/repository/public/'
    }

    // Jitpack pre-configured: com.github.* dependencies (incl. UniMixins)
    // no longer need the repository to be declared manually
    maven {
        name "Jitpack"
        url "https://jitpack.io"
    }
}

// Mod dependencies live in dependencies.gradle (like GTNH ExampleMod1.7.10)
apply from: 'dependencies.gradle'

// === === === MCLib Integration (optional, default OFF) === === ===
// MCLib (https://github.com/makamys/MCLib) integration lives in mclib.gradle:
// shade the library into the jar, repackage it under this mod's package via
// srgExtra and bundle its classes. It only applies when
// enableUsingMCLib=true; otherwise the MCLib compat sources under
// <modPackage>/mclib/ are excluded from compilation so the build works
// without the library on the classpath.
// MCLib 集成逻辑位于 mclib.gradle：shade 依赖、srgExtra 重打包、并入 jar。
// 仅当 enableUsingMCLib=true 时应用；否则排除 <模组包>/mclib/ 下的兼容源码，
// 保证未引入该库时也能正常编译。
if (project.enableUsingMCLib.toBoolean()) {
    apply from: 'mclib.gradle'
} else {
    def modPackagePath = project.modGroupId.toString().replace('.', '/')
    sourceSets.main.java.exclude("${modPackagePath}/mclib/**")
}

def dependenciesList = []
if (!project.modDependencies.isEmpty()) dependenciesList.add(project.modDependencies)

// Tags.java based metadata extraction (modVersion/modName/modId) lives in
// versioning.gradle; it overwrites project.version before processResources runs.
// Optionally (enableGitTagVersioning=true) it derives the version from git
// tags instead and regenerates Tags.java, see versioning.gradle.
// 基于 Tags.java 的元数据提取（modVersion/modName/modId）逻辑位于 versioning.gradle，
// 它会在 processResources 执行前覆盖 project.version。可选开启 enableGitTagVersioning=true
// 后改为从 git tag 推导版本并自动改写 Tags.java，详见 versioning.gradle。
apply from: 'versioning.gradle'

processResources {
    inputs.property "modversion", project.version
    inputs.property "mcversion", project.minecraft.version
    inputs.property "moddescription", project.modDescription
    inputs.property "modname", project.modName
    inputs.property "modid", project.modId

    inputs.property "url", project.url
    inputs.property "authorList", [project.authorList]
    inputs.property "credits", project.credits
    inputs.property "logo", project.logo
    inputs.property "dependencies", dependenciesList

    filesMatching("mcmod.info") {
        expand  'modversion': project.version,
                'mcversion': project.minecraft.version,
                'moddescription': project.modDescription,
                'modname': project.modName,
                'modid': project.modId,
                'url': project.url,
                'authorList': [project.authorList],
                'credits': project.credits,
                'logo': project.logo,
                'dependencies': dependenciesList
    }

    // Auto-fill the ${modid} placeholder inside the Mixin config (e.g. the
    // refmap name) and rename the template file to mixins.<modId>.json, so it
    // matches the MixinConfigs manifest attribute declared in mixin.gradle.
    // Skipped in Beneath Mixin mode: this mod owns no Mixin config there, and
    // a leftover template config must not be expanded/renamed into the jar.
    // The two patterns are OR-ed: the stock template name and the
    // already-renamed name, so each file is processed exactly once.
    if (!project.enableBeneathMixin.toBoolean()) {
        filesMatching(["mixins.examplemod.json", "mixins.${project.modId}.json".toString()]) {
            def expectedName = "mixins.${project.modId}.json".toString()
            if (it.name != expectedName) {
                it.name = expectedName
            }
            expand 'modid': project.modId
        }
    } else {
        // Beneath Mixin mode: this mod ships no Mixin config at all. Drop any
        // leftover (template) config from the packaged resources so neither
        // MixinConfigs nor Mixin auto-discovery can ever pick one up.
        exclude "mixins.*.json"
    }
}

// === === === Mixin Mode Resolution === === ===
// Two concepts are kept separate:
//   1. Mixin runtime  : UniMixins on the classpath + MixinTweaker in the dev
//                       environment, so mods that USE Mixin can load.
//   2. Own Mixin config: this mod owning mixins.<modId>.json and declaring it
//                       via the jar manifest (MixinConfigs).
// enableBeneathMixin=true means "(2) does not apply to this mod, but (1) must
// stay present for a prerequisite mod". It therefore only makes sense
// together with enableUsingMixin=true.
if (project.enableBeneathMixin.toBoolean() && !project.enableUsingMixin.toBoolean()) {
    throw new GradleException("enableBeneathMixin=true requires enableUsingMixin=true: " +
            "Beneath Mixin mode keeps the Mixin runtime for prerequisite mods, " +
            "so the Mixin integration cannot be disabled entirely.")
}
ext.beneathMixinEnabled = project.enableBeneathMixin.toBoolean()

// UniMixins integration lives in mixin.gradle
if (project.enableUsingMixin.toBoolean()) {
    apply from: 'mixin.gradle'
} else {
    jar {
        from {
            configurations.includeCompile.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
}

// === === === Developer Account (GTNH style) === === ===
// Fixed developer account for runClient: the player name comes from
// developmentEnvironmentUserName (default "developer") instead of a random
// Player; the UUID is deterministically derived from the username via
// UUID.nameUUIDFromBytes (the offline fallback used by GTNH RetroFuturaGradle),
// so the same name always maps to the same UUID. Different developers just use
// different names. Temporary override: gradlew runClient -PdevName=Alice
def devName = project.hasProperty('devName') && !project.devName.toString().isEmpty()
        ? project.devName
        : (project.hasProperty('developmentEnvironmentUserName') && !project.developmentEnvironmentUserName.toString().isEmpty()
            ? project.developmentEnvironmentUserName
            : 'developer')
def devUUID = project.hasProperty('developmentEnvironmentUUID') && !project.developmentEnvironmentUUID.toString().isEmpty()
        ? project.developmentEnvironmentUUID
        : UUID.nameUUIDFromBytes(devName.getBytes('UTF-8')).toString()

runClient {
    doFirst {
        println ">>> Starting Minecraft with developer account: ${devName} (UUID: ${devUUID})"
    }
    args '--username', devName
    args '--uuid', devUUID
}

sourceCompatibility = targetCompatibility = "1.8"

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation" << "-Xlint:all"
}

if (project.enableUsingKotlin.toBoolean()) {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
}

tasks.register('deobfJar', Jar) {
    dependsOn reobf
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    classifier 'deobf'

    from sourceSets.main.output
    manifest.attributes(jar.manifest.getAttributes())
}

tasks.register('sourcesJar', Jar) {
    dependsOn classes
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    classifier 'deobf-sources'

    from sourceSets.main.allSource
    exclude "methods.bin"
    exclude "McpToSrg.csv"
}

tasks.register("updateGradleProperties") {
    doLast {
        def propsFile = file("gradle.properties")
        if (!propsFile.exists()) {
            throw new GradleException("gradle.properties Not Found")
        }

        def updated = propsFile.text.replaceAll(/modVersion\s*=.*\n/, "modVersion=${modVersion}\n")
        propsFile.text = updated
        println ">>> Have upgraded modVersion=${modVersion} from gradle.properties"
    }
}

tasks.named("build").configure {
    dependsOn("updateGradleProperties")
}

artifacts {
    archives deobfJar
    archives sourcesJar
}

if (project.include_license.toBoolean()){
    jar {
        from file("./LICENSE")
    }
    deobfJar {
        from file("./LICENSE")
    }
    sourcesJar {
        from file("./LICENSE")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact deobfJar
            groupId = project.group
            artifactId = project.archivesBaseName
            version = project.version

            // Filter out dependencies without a groupId (e.g. forgeBin)
            pom.withXml {
                def depsNode = asNode().get("dependencies")
                if (depsNode.size() > 0) {
                    depsNode[0].children().removeAll { dep ->
                        if (!(dep instanceof Node)) return false
                        if (dep.name().localPart != "dependency") return false
                        def groupIdNodes = dep.get("groupId")
                        return groupIdNodes.isEmpty() || groupIdNodes[0].text().trim().isEmpty()
                    }
                }
            }
        }
    }
}
