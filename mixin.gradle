// ============================================================
// mixin.gradle - UniMixins integration script
// UniMixins integration (Mixin loading + ASM transformer compatibility)
//
// UniMixins provides both Mixin loading and ASM compatibility
// (Mixingasm module), so no separate MixinBooter / SpongeMixins / ASM
// compatibility layer is needed.
// https://github.com/LegacyModdingMC/UniMixins
// ============================================================

// The jitpack.io repository is pre-configured in build.gradle

def unimixinsVersion = project.findProperty('unimixinsVersion')

dependencies {
    // unimixins-all includes: UniMix (Mixin fork), SpongeMixins, MixinBooterLegacy,
    // MixinExtras, GTNHMixins, Compat, Mixingasm
    implementation("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
    annotationProcessor("com.github.LegacyModdingMC.UniMixins:unimixins-all-1.7.10:$unimixinsVersion:dev")
}

// Launch Mixin in the dev environment
runClient {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

runServer {
    args("--tweakClass", "org.spongepowered.asm.launch.MixinTweaker")
}

def outSrgFile = "${tasks.compileJava.temporaryDir}/outSrg.srg"
def outRefMapFile = "${tasks.compileJava.temporaryDir}/mixins.${modId}.refmap.json"

jar {
    manifest {
        attributes (
                'TweakClass': 'org.spongepowered.asm.launch.MixinTweaker',
                'MixinConfigs': "mixins.${modId}.json",
                'ForceLoadAsMod': 'true',
                'FMLCorePluginContainsFMLMod': 'true',
        )
    }

    from outRefMapFile;
}

// Feed the Mixin annotation processor with SRG mappings and refmap output
tasks.compileJava.options.compilerArgs += ["-AreobfSrgFile=${tasks.reobf.srg}", "-AoutSrgFile=${outSrgFile}", "-AoutRefMapFile=${outRefMapFile}"];

reobf {
    addExtraSrgFile outSrgFile
}
